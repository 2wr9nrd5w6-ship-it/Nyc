<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NYC Explorer 3D</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ec9e8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}
  #game{position:fixed;inset:0}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}
  .pill{background:#101923c9;border:1px solid #ffffff40;border-radius:12px;padding:9px 12px;font-size:13px}
  #help{position:fixed;left:12px;top:64px;max-width:210px;background:#101923bd;color:#fff;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.45}
  #controls{position:fixed;inset:auto 0 14px 0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}
  .cluster{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:6px;pointer-events:auto}
  button{border:1px solid #ffffff66;background:#101923bd;color:white;border-radius:14px;font-size:21px;font-weight:700;backdrop-filter:blur(5px);touch-action:none}
  button:active{background:#3478b8}
  .up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  #actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:stretch}
  #actions button{font-size:13px;padding:12px 13px;min-width:100px}
  #message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;background:#101923d9;padding:16px 20px;border-radius:14px;text-align:center;max-width:80%;line-height:1.5;display:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101923;color:white;text-align:center;padding:24px;z-index:10}
  @media(min-width:800px){.cluster{grid-template-columns:62px 62px 62px;grid-template-rows:62px 62px}.cluster button{font-size:25px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><b>NYC EXPLORER 3D</b><p>3D 도시를 준비하는 중…</p><small>인터넷 연결이 필요합니다.</small></div></div>
<div id="hud"><div class="pill"><b>NYC EXPLORER</b><br><span id="mode">도보 모드</span></div><div class="pill" id="location">미드타운 · 뉴욕</div></div>
<div id="help">왼쪽 버튼으로 이동 · 화면을 드래그해 시점 회전<br>차량 가까이에서 <b>차 타기</b>를 눌러보세요.</div>
<div id="controls">
  <div class="cluster">
    <button class="up" data-key="forward">▲</button><button class="left" data-key="left">◀</button>
    <button class="down" data-key="back">▼</button><button class="right" data-key="right">▶</button>
  </div>
  <div id="actions"><button id="ride">🚕 차 타기</button><button id="jump">점프</button><button id="reset">위치 초기화</button></div>
</div>
<div id="message"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const loading=document.getElementById('loading'), message=document.getElementById('message');
if(!window.THREE){loading.innerHTML='<div><b>3D 라이브러리를 불러오지 못했어요.</b><p>인터넷 연결을 확인하고 페이지를 새로고침해 주세요.</p></div>';return;}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9ec9e8); scene.fog=new THREE.Fog(0x9ec9e8,150,460);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x5a534a,2.0));
const sun=new THREE.DirectionalLight(0xfff0d7,2.2);sun.position.set(-80,130,60);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x777c78));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x292e33), sidewalkMat=mat(0xb9b6ac), lineMat=mat(0xe6e0c9), glass=mat(0x406274,.27,.3);
function box(w,h,d,material,x,y,z,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;}
function road(w,d,x,z){box(w,.12,d,roadMat,x,0,z,false);}
road(700,22,0,0);road(22,700,0,0);
for(let i=-320;i<=320;i+=5){if(Math.abs(i)<12)continue;box(.12,.025,1.9,lineMat,i,.07,0,false);box(1.9,.025,.12,lineMat,0,.07,i,false);}
function crosswalk(x,z,horiz=true){for(let i=-8;i<=8;i+=2){if(horiz)box(1.1,.035,.45,lineMat,x+i,.09,z,false);else box(.45,.035,1.1,lineMat,x,.09,z+i,false)}}
crosswalk(0,12);crosswalk(12,0,false);crosswalk(0,-12);crosswalk(-12,0,false);
const buildingMats=[0x8a8b87,0xb3aaa0,0x6c7d85,0xc2b9a7,0x59636a,0x9b9a92,0x746c65].map(c=>mat(c,.72,.08));
function addWindows(x,z,w,h,d,levels,floorsWide){
  const winMat=mat(0x263e4c,.35,.2), lit=mat(0xd8c79b,.45,.1);
  for(let f=1;f<levels;f++){for(let a=0;a<floorsWide;a++){let wx=x-w/2+(a+.5)*w/floorsWide;for(const face of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(Math.min(.8,w/floorsWide*.45),.72,.05),Math.random()<.16?lit:winMat);win.position.set(wx,f*(h/levels)+.9,z+face*(d/2+.025));scene.add(win);}}}
}
function building(x,z,w,d,h,idx){
 const floors=Math.max(3,Math.floor(h/3.5)), bw=box(w,h,d,buildingMats[idx%buildingMats.length],x,h/2,z);
 const winMat=mat(0x273e4b,.3,.2), litMat=mat(0xc9b887,.45,.1);
 const stepX=Math.max(2.3,w/Math.max(2,Math.floor(w/3.3))), stepZ=Math.max(2.3,d/Math.max(2,Math.floor(d/3.3)));
 for(let y=2.5;y<h-1;y+=3.1){
  for(let xx=-w/2+1.3;xx<w/2-0.5;xx+=stepX){
   for(const side of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(Math.min(1.15,stepX*.5),1.35,.07),Math.random()<.13?litMat:winMat);win.position.set(x+xx,y,z+side*(d/2+.04));scene.add(win);}
  }
  for(let zz=-d/2+1.3;zz<d/2-.5;zz+=stepZ){
   for(const side of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(.07,1.35,Math.min(1.15,stepZ*.5)),Math.random()<.13?litMat:winMat);win.position.set(x+side*(w/2+.04),y,z+zz);scene.add(win);}
  }
 }
 // rooftop mechanical details
 if(h>35){box(w*.35,1.8,d*.35,buildingMats[(idx+2)%buildingMats.length],x,h+.9,z);if(h>65)box(w*.12,5,d*.12,mat(0x777a7b),x,h+4,z);}
 return bw;
}
// city blocks with avenues, leaving the central roads open
let seed=45;function rand(){seed=(seed*9301+49297)%233280;return seed/233280;}
let idx=0;
for(let bx=-5;bx<=5;bx++)for(let bz=-5;bz<=5;bz++){
 const x=bx*52+(rand()-.5)*5,z=bz*52+(rand()-.5)*5;
 if(Math.abs(x)<28||Math.abs(z)<28)continue;
 const w=25+rand()*17,d=24+rand()*17,h=18+Math.pow(rand(),.6)*76;
 building(x,z,w,d,h,idx++);
 // sidewalk edge and street trees
 for(const side of [-1,1]){const tx=x+side*(w/2+3);if(Math.abs(tx)<14)continue;
  if(rand()>.35){box(.55,3.1,.55,mat(0x655044),tx,1.55,z+8);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.1,8,7),mat(0x315e43));crown.position.set(tx,4.1,z+8);scene.add(crown);}
 }
}
// Empire State Building recognizable stepped silhouette near one side of the map
function empire(x,z){
 const stone=mat(0xaaa79c), dark=mat(0x53636b,.3,.25);
 box(22,54,22,stone,x,27,z);
 box(18,24,18,stone,x,66,z);
 box(14,18,14,stone,x,87,z);
 box(10,12,10,stone,x,102,z);
 box(5,18,5,dark,x,117,z);
 const spire= new THREE.Mesh(new THREE.CylinderGeometry(.15,1.2,15,8),dark);spire.position.set(x,133,z);scene.add(spire);
 for(let y=12;y<105;y+=8){for(let xx=-8;xx<=8;xx+=4){box(.8,2,.08,mat(0x263e4c),x+xx,y,z+11.08,false);}}
 const sign=box(10,1.5,.25,mat(0x17232c),x,8,z+11.3,false);
}
empire(-105,-115);
// Times Square billboards around a plaza
box(48,.15,40,mat(0x4c4b48),-105,0,-8,false);
const neon=[0xff4c52,0x24c5df,0xf8c840,0xe85bf2,0x61d987];
for(let i=0;i<10;i++){
 const x=-126+(i%5)*10,z=-32+Math.floor(i/5)*14,h=12+rand()*13;
 box(7,h,1.0,mat(0x353a40),x,h/2,z);
 box(6.2,h*.72,.12,mat(neon[i%neon.length],.3,.2),x,h*.57,z+.58);
}
// Water tower / rooftop detail and lamp posts
for(let x=-250;x<250;x+=40)for(let z=-250;z<250;z+=40){if(Math.abs(x)<20||Math.abs(z)<20)continue;box(.18,5,.18,mat(0x35383b),x,2.5,z);box(.8,.3,.5,mat(0xe5d5a0),x,5,z);}
function makeCar(x,z,color,rot=0){
 const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.8,4.4),mat(color,.35,.25));body.position.y=.8;body.castShadow=true;g.add(body);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.7,2.1),glass);cabin.position.set(0,1.48,-.15);g.add(cabin);
 const wheelMat=mat(0x151719,.85), hub=mat(0x9ba0a3,.4,.5);
 for(const xx of [-1.12,1.12])for(const zz of [-1.35,1.35]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),wheelMat);wh.rotation.z=Math.PI/2;wh.position.set(xx,.4,zz);g.add(wh);const hh=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.23,10),hub);hh.rotation.z=Math.PI/2;hh.position.set(xx,.4,zz);g.add(hh);}
 const lightmat=mat(0xfff2c2);for(const xx of [-.75,.75]){const l=new THREE.Mesh(new THREE.BoxGeometry(.45,.18,.08),lightmat);l.position.set(xx,.86,2.22);g.add(l);}
 g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);return g;
}
const cars=[];for(let i=0;i<16;i++){const lane=i%2?5:-5;const z=-180+i*23;const car=makeCar(lane,z,[0xd4b02d,0x25282b,0xeeeeea,0x9b2429,0x3d657b][i%5],i%2?0:Math.PI);cars.push({mesh:car,z,speed:(i%2?1:-1)*(.05+rand()*.09),baseX:lane});}
const player= new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,4,8),mat(0x2d5f9a));torso.position.y=1.25;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),mat(0xd7b08c));head.position.y=2.05;player.add(head);scene.add(player);player.position.set(0,0,18);
let yaw=0, pitch=.18, inCar=false, currentCar=null, speed=0, jumpV=0, onGround=true;
const keys={};const keyMap={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
addEventListener('keydown',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=true;if(e.key===' '){jump();e.preventDefault();}});
addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false;});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));});
function say(t){message.textContent=t;message.style.display='block';setTimeout(()=>message.style.display='none',2100);}
function jump(){if(!inCar&&onGround){jumpV=.22;onGround=false;}}
document.getElementById('jump').onclick=jump;
document.getElementById('ride').onclick=()=>{
 if(inCar){inCar=false;player.visible=true;player.position.copy(currentCar.position);player.position.x+=3;currentCar=null;speed=0;document.getElementById('mode').textContent='도보 모드';say('차에서 내렸어요.');return;}
 let best=null,bd=12;for(const c of cars){const d=c.mesh.position.distanceTo(player.position);if(d<bd){best=c;bd=d;}}
 if(best){inCar=true;currentCar=best;player.visible=false;speed=0;document.getElementById('mode').textContent='운전 모드';say('운전 시작! 방향 버튼으로 주행하세요.');}else say('차량 가까이 다가가서 눌러보세요.');
};
document.getElementById('reset').onclick=()=>{inCar=false;currentCar=null;player.visible=true;player.position.set(0,0,18);yaw=0;speed=0;document.getElementById('mode').textContent='도보 모드';};
let dragging=false,px=0,py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.006;pitch=Math.max(-.05,Math.min(.65,pitch+dy*.003));});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 for(const c of cars){if(c!==currentCar){c.mesh.position.z+=c.speed*dt*20;if(c.mesh.position.z>220)c.mesh.position.z=-220;if(c.mesh.position.z< -220)c.mesh.position.z=220;}}
 const f=(keys.forward?1:0)-(keys.back?1:0), s=(keys.right?1:0)-(keys.left?1:0);
 if(inCar&&currentCar){
  speed+=(f*.018-speed*.025);speed=Math.max(-.22,Math.min(.42,speed));currentCar.mesh.rotation.y-=s*.025*(Math.abs(speed)*8+.2);
  const dir=currentCar.mesh.rotation.y;currentCar.mesh.position.x+=Math.sin(dir)*speed*60*dt;currentCar.mesh.position.z+=Math.cos(dir)*speed*60*dt;
  currentCar.mesh.position.x=THREE.MathUtils.clamp(currentCar.mesh.position.x,-320,320);currentCar.mesh.position.z=THREE.MathUtils.clamp(currentCar.mesh.position.z,-320,320);
 }else{
  const move= new THREE.Vector3(Math.sin(yaw)*f+Math.cos(yaw)*s,0,Math.cos(yaw)*f-Math.sin(yaw)*s);
  if(move.lengthSq()>0){move.normalize().multiplyScalar(12*dt);player.position.add(move);if(f||s)player.rotation.y=Math.atan2(move.x,move.z);}
  if(!onGround){player.position.y+=jumpV*60*dt;jumpV-=.012*60*dt;if(player.position.y<=0){player.position.y=0;jumpV=0;onGround=true;}}
  player.position.x=THREE.MathUtils.clamp(player.position.x,-325,325);player.position.z=THREE.MathUtils.clamp(player.position.z,-325,325);
 }
 const target=inCar&&currentCar?currentCar.mesh.position:player.position;
 const camDist=inCar?15:10;const desired=new THREE.Vector3(target.x-Math.sin(yaw)*camDist,target.y+(inCar?7:5)+pitch*7,target.z-Math.cos(yaw)*camDist);
 camera.position.lerp(desired,.12);camera.lookAt(target.x,target.y+(inCar?1.5:1.3),target.z);
 const nearTimes=Math.hypot(target.x+105,target.z+8)<65;
 document.getElementById('location').textContent=nearTimes?'타임스 스퀘어':'미드타운 · 뉴욕';
 document.getElementById('ride').textContent=inCar?'🚶 차에서 내리기':'🚕 차 타기';
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
setTimeout(()=>{loading.style.display='none';say('뉴욕에 도착했어요! 타임스 스퀘어와 엠파이어 스테이트 빌딩을 찾아보세요.');},700);
animate();
})();
</script>
</body>
</html>
